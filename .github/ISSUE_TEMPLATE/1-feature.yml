name: 機能追加 (Feature)
description: 新機能・機能追加の提案または実装タスク
title: "[Feature]: "
labels: ["feature"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: 何のためにこの機能が必要か
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景
    validations:
      required: false
  - type: textarea
    id: todo
    attributes:
      label: やること
      value: |
        - [ ]
    validations:
      required: false
  - type: textarea
    id: done
    attributes:
      label: 完了条件
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: 関連文書 / 関連PR
    validations:
      required: false
