name: CD

# devへのpush: 変更対象のみdev環境へ自動デプロイ
# mainへのマージ(push): 変更対象のみprod環境へデプロイ（GitHub Environmentの承認ゲート必須）
# （docs/infra/04_DEPLOY.md §2・§3）

on:
  push:
    branches: [dev, main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      api: ${{ steps.filter.outputs.api }}
      agent: ${{ steps.filter.outputs.agent }}
      infra: ${{ steps.filter.outputs.infra }}
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            frontend:
              - 'frontend/**'
              - 'packages/shared-schemas/**'
            api:
              - 'api/**'
              - 'packages/shared-schemas/**'
            agent:
              - 'agent/**'
              - 'packages/shared-schemas/**'
            infra:
              - 'infra/terraform/**'

      - name: resolve target environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          fi

  deploy-infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      # terraform.tfvarsはローカル専用でcommitしない（.gitignoreで除外済み）。
      # CIはTF_VAR_*環境変数で同じ変数に値を渡す（docs/infra/02_PARAMS_DEF.md §13）。
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_github_actions_deploy_sa_email: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT_EMAIL }}

      - uses: hashicorp/setup-terraform@v3

      - name: terraform apply
        run: |
          terraform -chdir=infra/terraform/environments/${{ needs.changes.outputs.environment }} init
          terraform -chdir=infra/terraform/environments/${{ needs.changes.outputs.environment }} apply -auto-approve

  # deploy-infraがinfra変更なしでskipされた場合でも、frontend/api/agentは実行できるようにする。
  # (!cancelled() で「デプロイ先ジョブがfailureでない限り続行」を明示している)

  deploy-frontend:
    # deploy-apiにも依存する: frontendのbuild時にAPIの実URLをVITE_API_BASE_URLへ
    # 埋め込むため（Cloud RunサービスはTerraformが既に作成済みの前提。
    # api未変更でdeploy-apiがskippedでも、既存サービスのURLは取得できる）。
    needs: [changes, deploy-infra, deploy-api]
    if: |
      !cancelled() &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ needs.changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT_EMAIL }}
          # Firebase CLI reads Application Default Credentials from this file
          # instead of FIREBASE_TOKEN / a service account key.
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v2

      - name: resolve deployed API URL
        id: api_url
        run: |
          URL=$(gcloud run services describe "real-conv-api-${{ needs.changes.outputs.environment }}" \
            --region=us-central1 \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - working-directory: frontend
        run: pnpm install --frozen-lockfile

      - working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.api_url.outputs.url }}
          VITE_USE_MOCK_API: "false"
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        run: pnpm build

      - run: npm install -g firebase-tools

      - name: deploy to Firebase Hosting
        run: >
          firebase deploy --only hosting:${{ needs.changes.outputs.environment }}
          --project=${{ vars.GCP_PROJECT_ID }} --non-interactive

  deploy-api:
    needs: [changes, deploy-infra]
    if: |
      !cancelled() &&
      needs.changes.outputs.api == 'true' &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ needs.changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      # region is inlined (us-central1, docs/infra/00_OVERVIEW.md §5) rather
      # than a GitHub variable, since it's the same for every environment.
      IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/real-conv-agents-${{ needs.changes.outputs.environment }}/api:${{ github.sha }}
      SERVICE_NAME: real-conv-api-${{ needs.changes.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: configure docker auth for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: build and push image
        # build context is the repo root (see api/Dockerfile's own comment)
        run: |
          docker build -f api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE }}
          region: us-central1

  deploy-agent:
    needs: [changes, deploy-infra]
    if: |
      !cancelled() &&
      needs.changes.outputs.agent == 'true' &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ needs.changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      # agent-engine-sa-{dev,prod} was created by Terraform (modules/iam).
      # gha-deploy-sa already has roles/iam.serviceAccountUser on it
      # (environments/{dev,prod}/main.tf's gha_act_as_agent_engine binding),
      # so it can deploy a Reasoning Engine that runs as this identity.
      AGENT_ENGINE_SA_EMAIL: agent-engine-sa-${{ needs.changes.outputs.environment }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      DISPLAY_NAME: real-conv-agent-${{ needs.changes.outputs.environment }}
      # bucket created by infra/terraform/environments/*/main.tf (google_storage_bucket.agent_staging)
      STAGING_BUCKET: gs://${{ vars.GCP_PROJECT_ID }}-agent-staging-${{ needs.changes.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT_EMAIL }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - working-directory: agent
        run: pip install -r requirements.txt

      - name: deploy agent (create on first run, update afterwards)
        working-directory: agent
        # set -o pipefail: without it, `python deploy.py | tee ...` reports the
        # exit code of `tee` (always 0), silently masking a failed deploy.py
        # as a successful step/job.
        run: |
          set -o pipefail
          python deploy.py \
            --project-id "${{ vars.GCP_PROJECT_ID }}" \
            --region us-central1 \
            --service-account "$AGENT_ENGINE_SA_EMAIL" \
            --display-name "$DISPLAY_NAME" \
            --staging-bucket "$STAGING_BUCKET" \
            | tee deploy-output.txt

      - name: surface resource_name in the run summary
        working-directory: agent
        run: |
          RESOURCE_NAME=$(grep '^AGENT_ENGINE_RESOURCE_NAME=' deploy-output.txt | cut -d= -f2-)
          {
            echo "### Agent Engine resource_name (${{ needs.changes.outputs.environment }})"
            echo '```'
            echo "$RESOURCE_NAME"
            echo '```'
            echo "If this is the first deploy for this environment, copy this value into"
            echo "infra/terraform/environments/${{ needs.changes.outputs.environment }}/terraform.tfvars's"
            echo "agent_engine_resource_name and re-apply, so the API picks it up too."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [changes, deploy-infra, deploy-frontend, deploy-api, deploy-agent]
    if: |
      !cancelled() &&
      needs.changes.outputs.environment == 'prod' &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped') &&
      (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      (needs.deploy-agent.result == 'success' || needs.deploy-agent.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: create release tag（記録用。デプロイのトリガーではない）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$(date +%Y.%m.%d)-${GITHUB_SHA::7}" --generate-notes
